name: Infrastructure

on:
  push:
    branches: [ main, master ]
    paths:
      - 'deploy/main.bicep'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'deploy/main.bicep'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      seedPlaceholderSecrets:
        description: 'Seed CHANGE_ME placeholders in Key Vault. ONLY on first deploy — otherwise overwrites real secrets.'
        type: boolean
        default: false
      seedAppSettings:
        description: 'Seed App Service appSettings with Bicep defaults. ONLY on first deploy or intentional reset — otherwise wipes manual Portal edits (AccountId, demo/live URLs, etc.).'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RG:       crv-trading-rg
  AZURE_LOCATION: eastus

jobs:
  # ── PR: preview changes without applying ────────────────────────────
  plan:
    name: what-if (plan)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preserve current container image
        id: current
        run: |
          img=$(az webapp config show -g "$AZURE_RG" -n crv-trading \
                --query linuxFxVersion -o tsv 2>/dev/null || echo "")
          if [[ -n "$img" ]]; then
            echo "image=$img" >> "$GITHUB_OUTPUT"
          fi

      - name: what-if
        id: whatif
        env:
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
        run: |
          args=(-g "$AZURE_RG" -f deploy/main.bicep)
          if [[ -n "${{ steps.current.outputs.image }}" ]]; then
            args+=(-p "containerImage=${{ steps.current.outputs.image }}")
          fi
          if [[ -n "$ENTRA_CLIENT_ID" ]]; then
            args+=(-p "entraClientId=$ENTRA_CLIENT_ID")
          fi
          echo '```' > whatif.txt
          az deployment group what-if "${args[@]}" >> whatif.txt 2>&1 || true
          echo '```' >> whatif.txt
          {
            echo "### Infra what-if"
            cat whatif.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with what-if
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = "### Infra what-if\n\n" + fs.readFileSync('whatif.txt', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # ── Main/master: apply ──────────────────────────────────────────────
  apply:
    name: deploy Bicep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: az group create -n "$AZURE_RG" -l "$AZURE_LOCATION" -o none

      - name: Preserve current container image
        id: current
        run: |
          img=$(az webapp config show -g "$AZURE_RG" -n crv-trading \
                --query linuxFxVersion -o tsv 2>/dev/null || echo "")
          if [[ -n "$img" ]]; then
            echo "image=$img" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Bicep
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.AZURE_RG }}
          template: deploy/main.bicep
          parameters: >-
            ${{ steps.current.outputs.image && format('containerImage={0}', steps.current.outputs.image) || '' }}
            ${{ secrets.ENTRA_CLIENT_ID && format('entraClientId={0}', secrets.ENTRA_CLIENT_ID) || '' }}
            ${{ inputs.seedPlaceholderSecrets && 'seedPlaceholderSecrets=true' || '' }}
            ${{ inputs.seedAppSettings && 'seedAppSettings=true' || '' }}
          failOnStdErr: false

      # Note: deploy.yml auto-discovers the ACR name via `az acr list` in the RG,
      # so we don't need to persist it to a repo variable here (which would require
      # elevated GITHUB_TOKEN permissions the default token doesn't have).

      - name: Summary
        run: |
          {
            echo "### Infra deployed"
            echo "- **App:** https://${{ steps.deploy.outputs.siteHostname }}"
            echo "- **ACR:** ${{ steps.deploy.outputs.acrLoginServer }}"
            echo "- **Key Vault:** ${{ steps.deploy.outputs.keyVaultName }}"
          } >> "$GITHUB_STEP_SUMMARY"
